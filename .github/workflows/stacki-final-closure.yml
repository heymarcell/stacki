name: Stacki final closure qualification

on:
  push:
    branches: [fix/mcp-dogfood-defects]

permissions:
  contents: write

env:
  STACKI_NO_DIALOGS: '1'
  STACKI_HIDDEN_WINDOW: '1'
  STACKI_CANVAS_CACHE: ${{ github.workspace }}/.astro-cache

jobs:
  qualify:
    runs-on: macos-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-dogfood-defects
          fetch-depth: 0
      - name: Verify recovered base and patch exact two closure defects
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/mcp-dogfood-defects
          test "$(git rev-parse origin/main)" = "0b756269054abab141d131c5a6288346603a23e0"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/support/mcpScenarioSet.js')
          text = p.read_text()
          start_marker = "fullScenario({ domain: 'target', action: 'move', run: async ({ call, fixture }) => {"
          start = text.index(start_marker)
          end = text.index("\nfullScenario({ domain: 'target', action:", start + len(start_marker))
          old = text[start:end]
          stale = "['the div is now ahead of the layout it used to be inside', grid >= 0 && base >= 0 && grid < base]"
          if old.count(stale) != 1:
              raise SystemExit('stale target.move oracle is not unique')
          replacement = r'''fullScenario({ domain: 'target', action: 'move', run: async ({ call, fixture }) => {
            // With no parent named, index is a position among the node's CURRENT
            // siblings. Explicit parentRef:null is the separate document-root move.
            // Prove the div stayed in <Base> and moved to index 0 inside it.
            const { envelope } = await call('target', 'move', { ref: await nodeNamed(call, 'div'), to: { index: 0 } });
            const src = fixture.read(INDEX);
            const grid = src.indexOf('class="pricing-grid"');
            const base = src.indexOf('<Base>');
            const hero = src.indexOf('<Hero');
            const footer = src.indexOf('<footer>');
            const closeBase = src.indexOf('</Base>');
            const block = (src.match(/<div class="pricing-grid">[\s\S]*?<\/div>/) || [''])[0];
            return { envelope, checks: [
              ['the div stays inside the layout when no parent is named', grid >= 0 && base >= 0 && grid > base && grid < closeBase],
              ['and moved to index 0 among that layout\'s children', hero >= 0 && grid < hero],
              ['and there is still exactly one of it', countOf(src, /pricing-grid/g) === 1],
              ['its children travelled with it', block.includes('{plans.map((plan) => (') && block.includes('<Card title={plan.title}')],
              ['what it was beside stayed in the same layout, after it', hero > grid && hero < closeBase && footer > hero && footer < closeBase],
              ['and the frontmatter the moved node reads came with it', src.includes('const plans = [')],
            ] };
          } });
          '''
          p.write_text(text[:start] + replacement + text[end:])
          q = Path('.github/workflows/ci.yml')
          ci = q.read_text()
          if ci.count('stacki-npm-test-entries: 192') != 1 or ci.count('stacki-npm-test-files: 194') != 1:
              raise SystemExit('stale CI count markers are not unique')
          q.write_text(ci.replace('stacki-npm-test-entries: 192', 'stacki-npm-test-entries: 195').replace('stacki-npm-test-files: 194', 'stacki-npm-test-files: 197'))
          PY
          git rm .github/workflows/stacki-final-closure.yml
          git diff --check
          git config user.name "Stacki Closure"
          git config user.email "closure@stacki.invalid"
          git add .github/workflows/ci.yml test/support/mcpScenarioSet.js
          git diff --cached --check
          git commit -m "Close post-PR31 qualification regressions"
          git push origin HEAD:fix/mcp-dogfood-defects
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Establish mandated Node path
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          node_root="$(dirname "$(dirname "$node_bin")")"
          mkdir -p "$HOME/.nvm/versions/node"
          ln -s "$node_root" "$HOME/.nvm/versions/node/v24.12.0"
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          test "$(node -v)" = "v24.12.0"
      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          npm ci
          git config --global user.name "Stacki CI"
          git config --global user.email "ci@stacki.invalid"
          npm run build
      - name: Targeted closure gates
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          npm run test:movedest
          npm run test:stylebatch
          npm run test:stylewriteshape
          npm run test:stylecascade
          npm run test:contentsafety
          npm run test:schemastrictness
          npm run test:mcpwire
          npm run test:packaging
      - name: Mutation, target.move wire oracle must die and restore exactly
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          before="$(shasum -a 256 test/support/mcpScenarioSet.js | awk '{print $1}')"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/support/mcpScenarioSet.js')
          s=p.read_text()
          old="['the div stays inside the layout when no parent is named', grid >= 0 && base >= 0 && grid > base && grid < closeBase]"
          new="['the div stays inside the layout when no parent is named', grid >= 0 && base >= 0 && grid < base && grid < closeBase]"
          if s.count(old) != 1: raise SystemExit('mutation target not unique')
          p.write_text(s.replace(old,new))
          PY
          set +e
          npm run test:mcpwire > "$RUNNER_TEMP/mutation-mcpwire.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/mutation-mcpwire.log"
          test "$rc" -ne 0
          grep -F 'target.move' "$RUNNER_TEMP/mutation-mcpwire.log"
          git restore --source=HEAD -- test/support/mcpScenarioSet.js
          after="$(shasum -a 256 test/support/mcpScenarioSet.js | awk '{print $1}')"
          test "$before" = "$after"
          npm run test:mcpwire
      - name: Mutation, stale package declaration must die and restore exactly
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          before="$(shasum -a 256 .github/workflows/ci.yml | awk '{print $1}')"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml')
          s=p.read_text().replace('stacki-npm-test-entries: 195','stacki-npm-test-entries: 192').replace('stacki-npm-test-files: 197','stacki-npm-test-files: 194')
          p.write_text(s)
          PY
          set +e
          npm run test:packaging > "$RUNNER_TEMP/mutation-packaging.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/mutation-packaging.log"
          test "$rc" -ne 0
          grep -F 'ci.yml says 192 entries and npm test has 195' "$RUNNER_TEMP/mutation-packaging.log"
          git restore --source=HEAD -- .github/workflows/ci.yml
          after="$(shasum -a 256 .github/workflows/ci.yml | awk '{print $1}')"
          test "$before" = "$after"
          npm run test:packaging
      - name: Full npm test normal order
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          npm test
      - name: Full suite reverse order, independent direct statuses
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          python3 - <<'PY'
          import json,re,subprocess,sys
          entries=json.load(open('package.json'))['scripts']['test'].split(' && ')
          print('QUALIFY reverse entries='+str(len(entries)))
          bad=[]
          for i,entry in enumerate(reversed(entries),1):
              m=re.fullmatch(r'npm run ([A-Za-z0-9_.:-]+)',entry)
              if not m: raise SystemExit('non-canonical entry: '+entry)
              print(f'REVERSE {i}/{len(entries)} {m.group(1)}',flush=True)
              rc=subprocess.run(['npm','run',m.group(1)]).returncode
              if rc: bad.append((m.group(1),rc))
          print('REVERSE FAILURES',bad)
          sys.exit(bool(bad))
          PY
      - name: Full suite deterministic shuffled order, independent direct statuses
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          python3 - <<'PY'
          import json,random,re,subprocess,sys
          seed=20260908
          entries=json.load(open('package.json'))['scripts']['test'].split(' && ')
          print(f'QUALIFY shuffle entries={len(entries)} seed={seed}')
          random.Random(seed).shuffle(entries)
          bad=[]
          for i,entry in enumerate(entries,1):
              m=re.fullmatch(r'npm run ([A-Za-z0-9_.:-]+)',entry)
              if not m: raise SystemExit('non-canonical entry: '+entry)
              print(f'SHUFFLE {i}/{len(entries)} {m.group(1)}',flush=True)
              rc=subprocess.run(['npm','run',m.group(1)]).returncode
              if rc: bad.append((m.group(1),rc))
          print('SHUFFLE FAILURES',bad)
          sys.exit(bool(bad))
          PY
      - name: Build exact frozen unsigned universal package and prove provenance
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -rf release
          npm run dist:mac:unsigned
          app="$(find release -type d -name Stacki.app -print -quit)"
          test -n "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$(shasum -a 256 "$app/Contents/Resources/app.asar" | awk '{print $1}')" >> "$GITHUB_ENV"
          node scripts/provenance.js "$app" "$PWD"
      - name: Current packaged acceptance floor
        shell: bash
        timeout-minutes: 80
        env:
          STACKI_LIFECYCLE_ITERATIONS: '5'
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          npm run test:packaging
          npm run test:packageddeeplink
          npm run test:packagedmcp
          npm run test:packagedacceptance
          npm run test:packagedaudit
          npm run test:packagedlifecycle
          npm run test:packagedundo
          npm run test:securemcploop
      - name: Finite native packaged dogfood with fail-closed GitHub containment
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          fake="$RUNNER_TEMP/stacki-fake-gh"
          log="$RUNNER_TEMP/stacki-fake-gh.log"
          mkdir -p "$fake/bin" "$fake/config"
          cat > "$fake/bin/gh" <<'GH'
          #!/bin/sh
          printf '%s\n' "$*" >> "$STACKI_FAKE_GH_LOG"
          echo 'blocked by Stacki final closure containment' >&2
          exit 97
          GH
          chmod +x "$fake/bin/gh"
          export STACKI_FAKE_GH_LOG="$log"
          export GH_CONFIG_DIR="$fake/config"
          export PATH="$fake/bin:$PATH"
          unset GH_TOKEN GITHUB_TOKEN GITHUB_ENTERPRISE_TOKEN GH_ENTERPRISE_TOKEN GITHUB_PAT
          test "$(command -v gh)" = "$fake/bin/gh"
          test -z "${GH_TOKEN-}${GITHUB_TOKEN-}${GITHUB_ENTERPRISE_TOKEN-}${GH_ENTERPRISE_TOKEN-}${GITHUB_PAT-}"
          node scripts/eval/dogfood-replay.js --app="$APP_PATH" --source="$PWD" --project="$PWD" --hidden
          echo FAKE_GH_CALLS_BEGIN
          test ! -f "$log" || cat "$log"
          echo FAKE_GH_CALLS_END
          rm -rf "$fake"
          test ! -e "$fake"
      - name: Final candidate identity and run-owned residue gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.12.0/bin:$PATH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          npm run test:tempownership
          npm run test:ownership
          printf 'CANDIDATE_SHA=%s\nCANDIDATE_TREE=%s\nAPP_PATH=%s\nPACKAGE_SHA256=%s\n' "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$APP_PATH" "$PACKAGE_SHA256"
