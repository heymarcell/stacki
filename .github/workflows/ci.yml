# Run the tests on every change, rather than discovering at release time that
# something broke weeks ago.
#
# `release.yml` only fires on a `v*` tag, so until this existed nothing on
# GitHub ever ran the suite. Three jobs, split by what they actually need:
#
#   core     — the whole suite, unabridged, on the platform Stacki ships to
#   protocol — the encryption, both relays, the workerd runtime and the
#              sabotage campaign, on Linux, where none of it is platform-bound
#   macos    — the packaged bundle, the built app, Launch Services, the Secure
#              Share states, and a real MCP client driving the whole system
#
# WHAT THIS MUST NOT TOUCH: a real keychain, a real Cloudflare account, Apple
# signing material, the user's projects, or a real userData directory. Every
# harness makes its own temp fixtures and removes them; nothing here logs in
# anywhere. The Cloudflare tests run against workerd locally and need no
# account.
#
# Node 24 rather than the 22 in release.yml: `relay/node/store.js` uses
# `node:sqlite`, which is only usable without a flag from 24 onwards.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an older run on the same ref, except on main, where
# every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # No harness may open a dialog: one that does would wait for a click that is
  # never coming, and the job would burn its timeout instead of failing.
  STACKI_NO_DIALOGS: '1'

jobs:
  core:
    name: core suite (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # No skips on this job. The canvas suites install Astro once into this
      # directory and copy from it; the cache means only the first run pays.
      STACKI_CANVAS_CACHE: ${{ github.workspace }}/.astro-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.astro-cache
          key: ${{ runner.os }}-astro-fixture-v1
      - run: npm ci
      # Stacki's "start a new site" flow makes the first commit for you, and
      # `git commit` refuses without an identity. A developer's machine has
      # one; a fresh runner does not, so test/starter.js failed on
      # `git rev-list HEAD` with nothing to count.
      - name: Give git an identity to commit as
        run: |
          git config --global user.name "Stacki CI"
          git config --global user.email "ci@stacki.invalid"
      # All 131 files, nothing excluded.
      #
      # WHY NOT LINUX. It was on ubuntu first, and 130 of the 131 passed there.
      # The one that did not is test/vars-row-height.js, which opens a real
      # window and synthesises a mouse drag with `sendInputEvent`; through xvfb
      # the pointer sequence does not arrive the way a real window server
      # delivers it, and six of its twenty-three checks fail. The test is
      # right and the display is the problem — so rather than weaken it or
      # skip it, the suite runs where Stacki actually ships. Linux keeps the
      # protocol job below, which is platform-independent by construction.
      - name: npm test
        run: npm test

  protocol:
    name: secure protocol + cloudflare (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STACKI_CANVAS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - name: Libraries Electron links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 \
            libdrm2 libxkbcommon0 libatk-bridge2.0-0 libatk1.0-0 libcups2
      - run: npm ci
      # CHROMIUM KEEPS ITS SANDBOX.
      #
      # Electron ships a setuid helper, `chrome-sandbox`, and refuses to start
      # unless it is owned by root with mode 4755 — "rather than run without
      # sandboxing I'm aborting now". npm unpacks it as the runner user, so on
      # a fresh Linux runner every real-browser harness dies on it.
      #
      # The fix everybody reaches for is `--no-sandbox`, which turns the
      # sandbox off for the whole run. This gives the helper the ownership it
      # is asking for instead, so the tests run with the same isolation a real
      # user's Electron has. macOS needs none of this.
      - name: Let Electron keep its sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # The Worker's own dependencies, including the workerd runtime the
      # conformance suite runs inside.
      - run: npm ci --prefix relay/cloudflare

      - name: fixed vectors and the cryptography
        run: npm run test:securecrypto
      # The shared conformance suite runs inside this one for the Node relay,
      # and inside the Cloudflare job below for the Worker. If the two ever
      # disagree about what the protocol means, one of them fails it.
      - name: the Node relay
        run: npm run test:securerelay
      - name: two clients over a relay
        run: npm run test:secureshare
      - name: the Worker, in workerd, against a real Durable Object
        run: npm run relay:cf:test
      - name: the share page, in a real browser
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:sharepage
      # Each guard removed in turn, in the real files, to check something
      # notices. The suite restores every file and verifies it byte-identical.
      - name: the sabotage campaign
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:securesabotage

  macos:
    name: packaged acceptance (macos)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # THE CANVAS SUITES RUN FOR REAL HERE. They need Astro genuinely
      # installed, which the fixture does once into this directory and then
      # copies from. Cached between runs so only the first pays for it; if the
      # cache is cold the fixture installs it and the suites still run, because
      # STACKI_CANVAS_OFFLINE is deliberately NOT set on this job.
      STACKI_CANVAS_CACHE: ${{ github.workspace }}/.astro-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.astro-cache
          key: ${{ runner.os }}-astro-fixture-v1
      - run: npm ci
      - name: Give git an identity to commit as
        run: |
          git config --global user.name "Stacki CI"
          git config --global user.email "ci@stacki.invalid"

      # What ships inside the bundle, and what the bundle tells the operating
      # system. Reads the config rather than the built app, so it is quick and
      # runs before the ten-minute build.
      - name: what the package declares
        run: npm run test:packaging

      # Unsigned deliberately: no Apple credentials reach CI, and none are
      # needed to prove the bundle is correct.
      - name: build the unsigned app
        run: npm run dist:mac:unsigned

      # The real bundle, the real open(1), the real renderer. This is the only
      # thing that proves a clicked invitation reaches an app that was not
      # already running, because Launch Services consults the bundle and not a
      # runtime call.
      - name: a stacki:// link through Launch Services
        run: npm run test:packageddeeplink

      # Every Secure Share state, asserted before capture, at five window
      # sizes. Kept here rather than trusted to a screenshot diff: the harness
      # asserts the DOM it is about to photograph.
      - name: the Secure Share states
        run: npm run test:secureshareui

      # THE SEAM. A person comments in Stacki, a real MCP client finds that
      # comment, is handed the exact object it is anchored to, changes it,
      # photographs the result and answers in the thread. Every other suite
      # proves one layer; this proves they join up.
      - name: a real MCP client, end to end
        run: npm run test:mcpdogfood
